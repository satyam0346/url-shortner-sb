name: CI/CD — Build, Test & Deploy to Railway

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ── Job 1: Build & Test ─────────────────────────────────────────────────────
  build-and-test:
    name: Build & Test (Java 21 + H2)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & run tests (H2 in-memory DB)
        env:
          SPRING_PROFILES_ACTIVE: test
        run: mvn -ntp -B verify

      - name: Upload WAR artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: url-shortener-war
          path: target/*.war
          retention-days: 7

  # ── Job 2: Deploy to Railway (only on push to main) ─────────────────────────
  deploy:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service url-shortener-app --detach
