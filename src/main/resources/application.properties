spring.application.name=url-shortner-sb

# ── DataSource (PostgreSQL) ──────────────────────────────────────────────────
# Override via environment variables in production:
#   DB_URL, DB_USERNAME, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/url_shortener}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── Hibernate / JPA ─────────────────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ── JSP View Resolver ───────────────────────────────────────────────────────
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# ── Session ──────────────────────────────────────────────────────────────────
server.servlet.session.timeout=30m

# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Schema Init — disable auto-run of schema.sql in prod (Hibernate handles DDL)
spring.sql.init.mode=never

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.urlshortener=${LOG_LEVEL:INFO}
logging.level.org.hibernate.SQL=WARN

# ── Error Handling ───────────────────────────────────────────────────────────
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=never
server.error.include-exception=false
